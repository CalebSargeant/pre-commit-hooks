repos:
  - repo: local
    hooks:
      - id: run-all
        name: Run all validation checks
        entry: bash hooks/run-all.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
  - repo: https://github.com/MagmaMoose/chargate
    rev: v1
    hooks:
      - id: shellcheck
      - id: actionlint
      - id: hadolint
      - id: trivy
      - id: trufflehog
      - id: semgrep
      - id: checkov
