name: Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  semantic-release:
    uses: CalebSargeant/reusable-workflows/.github/workflows/semantic-release.yaml@fb7a4d7584e40e4aa543a0e178aab6b7d09e9f69 # v1.16.1
    with:
      bump: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump || '' }}
      working_directory: '.'
    secrets:
      SEMANTIC_RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      SEMANTIC_RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      id-token: write
